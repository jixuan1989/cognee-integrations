# Minimal Docker Compose for Cognee (local-only)
#
# Usage:
#   1. Export your LLM key: export LLM_API_KEY="your-openai-api-key" or set it in the .env file
#   2. Run: docker compose -f ./integrations/openclaw/cognee-docker-compose.yaml up -d
#   3. Verify: curl http://localhost:8000/health
#   4. Configure OpenClaw with baseUrl: http://localhost:8000

services:
  cognee:
    image: cognee/cognee:latest
    container_name: cognee
    ports:
      - "8001:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      # 关闭 API 鉴权，避免插件请求返回 401（与插件 apiKey 对齐见 doc/cognee-openclaw-api-key.md）
      - REQUIRE_AUTHENTICATION=false
      - ENABLE_BACKEND_ACCESS_CONTROL=false
      - LLM_PROVIDER=ollama
      - LLM_MODEL=qwen3:8b
      - LLM_ENDPOINT=http://host.docker.internal:11434/v1
      - COGNEE_SKIP_CONNECTION_TEST=true
      - LLM_API_KEY=ollama
      - LLM_MAX_TOKENS=16384
      - LLM_CONTEXT_WINDOW=128000
      - EMBEDDING_PROVIDER=ollama
      - EMBEDDING_MODEL=nomic-embed-text
      - EMBEDDING_DIMENSIONS=768
      - EMBEDDING_ENDPOINT=http://host.docker.internal:11434/api/embed
      - TOKENIZER_MODE=tiktoken
      - HUGGINGFACE_TOKENIZER=none
      - CHUNK_SIZE=1024
      - CHUNK_OVERLAP=128
      - TRANSFORMERS_OFFLINE=1
      - HF_DATASETS_OFFLINE=1
      - DB_PROVIDER=sqlite
      - VECTOR_DB_PROVIDER=lancedb
      - GRAPH_DATABASE_PROVIDER=kuzu
      - TELEMETRY_ENABLED=false
      - HOST=0.0.0.0
      - PORT=8000
    entrypoint: ["/bin/sh", "-c", "python3 /patches/patch-ollama-tokenizer.py && exec /app/entrypoint.sh"]
    volumes:
      - cognee_data:/app/cognee/.cognee_system
      - ./patch-ollama-tokenizer.py:/patches/patch-ollama-tokenizer.py:ro
    restart: unless-stopped

volumes:
  cognee_data:
    driver: local
